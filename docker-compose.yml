version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: encanto_db
    restart: always
    environment:
      POSTGRES_USER: encanto_user
      POSTGRES_PASSWORD: encanto_password
      POSTGRES_DB: encanto_tickets
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: